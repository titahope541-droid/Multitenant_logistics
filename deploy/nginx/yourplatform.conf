# ─────────────────────────────────────────────────────────────────────────────
# Meridian Multitenant Tracking Platform — production Nginx configuration
#
# Placement (Ubuntu/Debian):
#   sudo cp deploy/nginx/yourplatform.conf /etc/nginx/sites-available/yourplatform.conf
#   sudo ln -s /etc/nginx/sites-available/yourplatform.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ONE upstream serves everything in this architecture (unified server.ts):
# nttrack.com · admin.nttrack.com · api.nttrack.com · *.nttrack.com
# — the platform resolves tenants from the Host header itself.
# ─────────────────────────────────────────────────────────────────────────────

# Required for WebSocket (Socket.IO): translate the client's Upgrade intent
# into a proxy Connection header. Plain close keeps HTTP/1.1 clean elsewhere.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream meridian_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect (Certbot will manage certificates; the acme
#    challenge location must stay reachable on :80 for issuance) ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name .nttrack.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — every surface (root, admin, api, ALL tenant subdomains) ─────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name .nttrack.com;

    # Certbot (Let's Encrypt) fills these after: sudo certbot --nginx -d yourplatform.com -d '*.yourplatform.com'
    ssl_certificate     /etc/letsencrypt/live/nttrack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nttrack.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MERIDIAN_SSL:10m;
    ssl_prefer_server_ciphers off;

    # Reasonable payload ceiling for JSON bodies
    client_max_body_size 2m;

    # ── Socket.IO FIRST: exact path, long-lived, header-rich ────────────────
    # Why these headers:
    #   Upgrade/Connection   turn the request into a WebSocket session
    #   Host                 tenant identity resolution happens on the
    #                        hostname server-side — it must pass through intact
    #   X-Real-IP            rate limiting and logs should see the client
    #   X-Forwarded-For      client IP chain through Cloudflare/Nginx
    #   X-Forwarded-Proto    Secure-cookie logic checks the real scheme
    location /socket.io/ {
        proxy_pass http://meridian_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;          # realtime: never buffer frames
        proxy_cache off;
        proxy_read_timeout 3600s;     # idle sockets survive beyond default 60s
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
    }

    # ── Everything else: pages, /api/*, static assets ───────────────────────
    location / {
        proxy_pass http://meridian_app;
        proxy_http_version 1.1;

        # honor Upgrade hints for any future realtime-adjacent upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
